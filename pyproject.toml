[project]
name = "vitruvian"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "pymoo", "pyyaml", "matplotlib"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitruvian"]
