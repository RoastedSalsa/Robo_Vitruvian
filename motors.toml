# Actuator modules (motor, planetary gearbox and driver in one), all CubeMars, values from
# the specification tables on cubemars.com (product pages, October 2026). Torques and speeds
# are at the module output: gearbox efficiency is already inside them.
# rotor_inertia_gcm2 is on the motor side; the joint sees it multiplied by (ratio × belt or
# capstan ratio)². Each motor runs at its datasheet voltage, rated_V; where a sheet gives
# both 24 and 48 V, its 48 V point is used. max_V raises the voltage only where a datasheet
# allows more than rated_V (no-load speed scales with it); none of these do.
# `estimated` lists the fields that are guesses rather than datasheet values.
# Motors you can't publish go in motors.local.toml (gitignored), same format.

[[motor]]
name = "AK40-10"
rated_Nm = 1.3
peak_Nm = 4.1
mass_kg = 0.190
ratio = 10
rotor_inertia_gcm2 = 97.35
rated_rpm = 370
no_load_rpm = 435
rated_V = 24
source = "CubeMars AK40-10 V3.0 KV170"

